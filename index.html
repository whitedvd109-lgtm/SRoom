<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test</title>
    <style>
        body { background:#0b0b1a; color:#fff; font-family:sans-serif; text-align:center; padding-top:50px; }
    </style>
</head>
<body>
    <h1>If you see this, HTML works</h1>
    <div id="test"></div>
    <script>
        document.getElementById('test').innerText = 'JavaScript works!';
        // Проверим Telegram API
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            document.getElementById('test').innerText += ' (Telegram Mini App API OK)';
        }
    </script>
</body>
</html>
