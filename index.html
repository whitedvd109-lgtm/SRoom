<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Debug</title>
    <style>
        body { background:#0b0b1a; color:#fff; font-family:sans-serif; padding:20px; }
        #error { color:red; background:#200; padding:10px; white-space:pre-wrap; }
    </style>
</head>
<body>
    <div id="error"></div>
    <div id="content"></div>

    <script>
    window.onerror = function(msg, url, line) {
        document.getElementById('error').innerText += 'Error: ' + msg + ' at line ' + line + '\n';
    };

    try {
        // === Telegram API ===
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // === Ticker ===
        let tickHTML = '';
        for (let i=0;i<30;i++) {
            let amt = Math.floor(Math.random()*4851)+150;
            tickHTML += 'Lot sold for $' + amt + ' • ';
        }
        document.getElementById('content').innerHTML += '<div style="color:#FFD966;overflow:hidden;white-space:nowrap;">' + tickHTML + '</div>';

        // === Profile circle ===
        document.getElementById('content').innerHTML += '<div onclick="alert(\'Register\')" style="width:90px;height:90px;background:rgba(99,102,241,0.2);border:2px solid rgba(129,140,248,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:20px auto;cursor:pointer;"><svg width="42" height="42" viewBox="0 0 24 24" stroke="#a5b4fc" fill="none" stroke-width="1.6"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>';
        document.getElementById('content').innerHTML += '<div style="color:#a5b4fc;text-align:center;">Register</div>';

        // === 100 female names grid ===
        const femaleNames = ["Sophia","Olivia","Emma","Ava","Isabella","Mia","Luna","Harper","Evelyn","Ella","Avery","Scarlett","Grace","Chloe","Zoey","Lily","Hannah","Aria","Ellie","Nora","Leah","Maya","Riley","Naomi","Layla","Stella","Victoria","Aurora","Penelope","Addison","Brooklyn","Hazel","Aaliyah","Camila","Genesis","Natalie","Savannah","Aubrey","Bella","Skylar","Claire","Violet","Gabriella","Madelyn","Eleanor","Alice","Ruby","Ivy","Willow","Kinsley","Paisley","Lillian","Addison","Daisy","Nevaeh","Clara","Reagan","Morgan","Faith","Elena","Jade","Lydia","Taylor","Trinity","Sienna","Reese","Daniela","Summer","Brooke","Keira","Alina","Anastasia","Tessa","Liliana","Fiona","Giselle","Noelle","Kendall","Phoebe","Alana","Nadia","Catherine","Sasha","Leilani","Adriana","Julianna","Lola","Miranda","Gracelyn","Diana","Angelina","Cecilia","Megan","Logan","Brynn","Emerson","Jocelyn","Marley","Payton","Alexa"];
        let gridHTML = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">';
        femaleNames.forEach(name => {
            gridHTML += '<div style="background:rgba(255,255,255,0.04);border-radius:20px;padding:12px;text-align:center;"><div style="width:80px;height:80px;background:rgba(255,255,255,0.06);border-radius:50%;margin:0 auto;">Photo</div><div style="margin-top:8px;">' + name + '</div></div>';
        });
        gridHTML += '</div>';
        document.getElementById('content').innerHTML += gridHTML;

        document.getElementById('error').innerText += 'All code executed without errors.\n';
    } catch(e) {
        document.getElementById('error').innerText += 'Exception: ' + e.message + '\n' + e.stack;
    }
    </script>
</body>
</html>
