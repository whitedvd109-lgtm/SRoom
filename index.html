<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Marketplace TMA</title>
/* version: 1 */
<!-- Increment the version number above whenever you update the code to force Telegram WebView cache refresh -->
<style>
  :root {
    --bg1: #0b0b1a;
    --bg2: #14142b;
    --bg3: #0d0d24;
    --accent: #9b59b6;
    --yellow: #FFD966;
    --text: #e8e8f0;
    --muted: #8a8a9a;
    --card: #1a1a2e;
    --danger: #e74c3c;
    --success: #2ecc71;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: linear-gradient(160deg, var(--bg1), var(--bg2), var(--bg3));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }
  body {
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    position: relative;
    padding-bottom: 40px;
  }

  /* Ticker */
  .ticker-wrap {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 36px;
    background: rgba(11, 11, 26, 0.95);
    border-bottom: 1px solid rgba(255, 217, 102, 0.25);
    z-index: 1000;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  .ticker {
    display: flex;
    white-space: nowrap;
    animation: scroll 90s linear infinite;
    will-change: transform;
  }
  .ticker span {
    color: var(--yellow);
    font-size: 13px;
    font-weight: 600;
    text-shadow: 0 0 8px rgba(255, 217, 102, 0.7), 0 0 16px rgba(255, 217, 102, 0.4);
    padding: 0 6px;
  }
  .ticker .sep {
    color: rgba(255, 217, 102, 0.45);
    font-weight: 400;
  }
  @keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* Profile circle */
  .profile-area {
    margin-top: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0 8px;
  }
  .profile-circle {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    box-shadow: 0 0 18px rgba(155, 89, 182, 0.55), inset 0 0 12px rgba(155, 89, 182, 0.15);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: transform 0.15s ease;
  }
  .profile-circle:active { transform: scale(0.96); }
  .profile-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .profile-circle .icon-svg {
    width: 42px;
    height: 42px;
    fill: var(--accent);
    opacity: 0.9;
  }
  .profile-label {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    max-width: 140px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .badge {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 22px;
    height: 22px;
    background: var(--danger);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    border-radius: 11px;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
    box-shadow: 0 0 8px rgba(231, 76, 60, 0.6);
  }
  .badge.show { display: flex; }

  /* Sellers */
  .section-title {
    padding: 16px 16px 10px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .sellers-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 0 12px 24px;
  }
  .seller-card {
    background: var(--card);
    border-radius: 12px;
    padding: 10px 6px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .seller-photo {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #12122a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .seller-name {
    font-size: 12px;
    text-align: center;
    color: var(--text);
    line-height: 1.25;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Modals */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    z-index: 2000;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
  }
  .modal-overlay.show {
    display: flex;
  }
  .modal {
    background: linear-gradient(180deg, #1c1c32, #141428);
    width: 100%;
    max-width: 420px;
    border-radius: 18px 18px 0 0;
    max-height: 92vh;
    overflow-y: auto;
    padding: 20px 18px 28px;
    animation: slideUp 0.28s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .modal-title {
    font-size: 18px;
    font-weight: 700;
  }
  .modal-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: none;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.85; }
  .btn-primary {
    background: linear-gradient(135deg, #9b59b6, #8e44ad);
    color: #fff;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: var(--text);
  }
  .btn-danger {
    background: var(--danger);
    color: #fff;
  }
  .role-btn {
    background: var(--card);
    border: 1px solid rgba(155,89,182,0.35);
    color: var(--text);
    padding: 18px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
    cursor: pointer;
    text-align: center;
  }
  .role-btn:active { background: #22223a; }

  /* Form */
  .form-group {
    margin-bottom: 14px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.25);
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--accent);
  }
  .form-row {
    display: flex;
    gap: 10px;
  }
  .form-row .form-group { flex: 1; }

  /* Photo upload */
  .photo-slots {
    display: flex;
    gap: 10px;
    margin: 16px 0;
    justify-content: center;
  }
  .photo-slot {
    width: 90px;
    height: 90px;
    border-radius: 12px;
    background: rgba(0,0,0,0.3);
    border: 2px dashed rgba(155,89,182,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .photo-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .photo-slot .placeholder {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 4px;
  }
  .photo-input-hidden {
    display: none;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 10px;
  }

  /* Offers */
  .offer-item {
    background: var(--card);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .offer-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .offer-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #12122a;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--muted);
  }
  .offer-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .offer-name {
    font-weight: 600;
    font-size: 14px;
  }
  .offer-msg {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
    margin-bottom: 10px;
  }
  .empty-state {
    text-align: center;
    padding: 30px 10px;
    color: var(--muted);
    font-size: 14px;
  }

  /* Wallet */
  .wallet-info {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 16px;
    text-align: center;
  }

  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 3000;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="ticker-wrap">
    <div class="ticker" id="ticker"></div>
  </div>

  <div class="profile-area">
    <div class="profile-circle" id="profileCircle">
      <svg class="icon-svg" viewBox="0 0 24 24" id="defaultIcon">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v1.2h19.2v-1.2c0-3.2-6.4-4.8-9.6-4.8z"/>

<!-- Photo upload modal -->

<script>
/* version: 1 */
/*
  CONFIGURATION
  -------------
  Fill these values to enable admin notifications and optional JSONBin sync.
  Leave empty strings to run fully offline (localStorage only).

  BOT_TOKEN       - Telegram Bot token from @BotFather
  ADMIN_CHAT_ID   - Your Telegram chat/user ID that receives notifications
  JSONBIN_API_KEY - X-Master-Key from jsonbin.io
  JSONBIN_BIN_ID  - Bin ID that stores { profiles, buyerProfiles, settings }

  JSONBin expected structure:
  {
    "profiles": [ { id, name, age, country, height, weight, bust, params, photos:[], wallet:null, offers:[], role:"seller", lastOfferAt:0 } ],
    "buyerProfiles": [ { id, name, photo:"", message:"" } ],
    "settings": { adminWallets: { TRC20:"", ERC20:"" } }
  }
*/
const BOT_TOKEN = "";
const ADMIN_CHAT_ID = "";
const JSONBIN_API_KEY = "";
const JSONBIN_BIN_ID = "";

const STORAGE_KEY = "tma_marketplace_user_v1";
const LAST_OFFER_KEY = "tma_last_auto_offer_ts";

// Hardcoded list of 100 female names
const FEMALE_NAMES = [
  "Emma","Olivia","Ava","Isabella","Sophia","Mia","Charlotte","Amelia","Harper","Evelyn",
  "Abigail","Emily","Elizabeth","Sofia","Avery","Ella","Scarlett","Grace","Chloe","Victoria",
  "Riley","Aria","Lily","Aubrey","Zoey","Penelope","Lillian","Addison","Layla","Natalie",
  "Camila","Hannah","Brooklyn","Zoe","Nora","Leah","Savannah","Audrey","Claire","Eleanor",
  "Skylar","Ellie","Samantha","Stella","Paisley","Violet","Mila","Allison","Alexa","Anna",
  "Caroline","Genesis","Aaliyah","Kennedy","Kinsley","Allison","Maya","Sarah","Madelyn","Adeline",
  "Alexis","Ariana","Elena","Gabriella","Naomi","Alice","Sadie","Hailey","Eva","Emilia",
  "Autumn","Quinn","Nevaeh","Piper","Ruby","Serenity","Willow","Everly","Cora","Kaylee",
  "Luna","Bella","Lucy","Audrey","Arianna","Kennedy","Madeline","Ruby","Valentina","Brianna",
  "Katherine","Gianna","Sarah","Alexandra","Melanie","Jasmine","Morgan","Andrea","Lauren","Julia"
];

// State
let userProfile = null;
let buyerProfiles = [];
let pendingDealBuyer = null;
let selectedPhotos = [null, null, null];
let photoFiles = [];

// ---------- Utils ----------
function $(id) { return document.getElementById(id); }
function showModal(id) { $(id).classList.add("show"); }
function hideModal(id) { $(id).classList.remove("show"); }
function showLoading(v) { $("loadingOverlay").classList.toggle("show", !!v); }

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function loadUser() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) userProfile = JSON.parse(raw);
  } catch (e) { userProfile = null; }
}

function saveUser() {
  if (userProfile) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(userProfile));
  }
}

function generateTickerAmounts() {
  const amounts = new Set();
  while (amounts.size < 32) {
    amounts.add(randInt(150, 5000));
  }
  return Array.from(amounts);
}

function buildTicker() {
  const amounts = generateTickerAmounts();
  const parts = amounts.map(a => `Lot sold for $${a}`);
  // Duplicate for seamless loop
  const full = parts.concat(parts);
  const html = full.map((t, i) => {
    return `<span>${t}</span><span class="sep"> • </span>`;
  }).join("");
  $("ticker").innerHTML = html;
}

function buildSellersGrid() {
  const names = shuffle(FEMALE_NAMES);
  const grid = $("sellersGrid");
  grid.innerHTML = "";
  for (let i = 0; i < 100; i++) {
    const card = document.createElement("div");
    card.className = "seller-card";
    card.innerHTML = `
      <div class="seller-photo">Photo</div>
      <div class="seller-name">${names[i % names.length]}</div>
    `;
    grid.appendChild(card);
  }
}

function updateProfileUI() {
  const circle = $("profileCircle");
  const label = $("profileLabel");
  const img = $("profileImg");
  const icon = $("defaultIcon");
  const badge = $("offerBadge");

  if (userProfile && userProfile.role === "seller") {
    label.textContent = userProfile.name || "Seller";
    if (userProfile.photos && userProfile.photos[0]) {
      img.src = userProfile.photos[0];
      img.style.display = "block";
      icon.style.display = "none";
    } else {
      img.style.display = "none";
      icon.style.display = "block";
    }
    const unread = (userProfile.offers || []).filter(o => !o.read).length;
    if (unread > 0) {
      badge.textContent = unread > 99 ? "99+" : unread;
      badge.classList.add("show");
    } else {
      badge.classList.remove("show");
    }
  } else {
    label.textContent = "Register";
    img.style.display = "none";
    icon.style.display = "block";
    badge.classList.remove("show");
  }
}

// ---------- Telegram ----------
function initTelegram() {
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor("#0b0b1a");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#0b0b1a");
    }
  } catch (e) {}
}

async function notifyAdmin(text) {
  if (!8321043451:AAFkPYQUfofdsb7dbKBaZpxpJ3o55YHN9W8 || !8696933754) return;
  try {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: ADMIN_CHAT_ID,
        text: text,
        parse_mode: "HTML"
      })
    });
  } catch (e) {
    console.warn("Admin notify failed", e);
  }
}

// ---------- JSONBin (optional, non-blocking) ----------
async function fetchJsonBin() {
  if (!JSONBIN_API_KEY || !JSONBIN_BIN_ID) return null;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
      headers: { "X-Master-Key": JSONBIN_API_KEY }
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data.record || null;
  } catch (e) {
    console.warn("JSONBin fetch failed", e);
    return null;
  }
}

async function saveJsonBin(record) {
  if (!JSONBIN_API_KEY || !JSONBIN_BIN_ID) return;
  try {
    await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": JSONBIN_API_KEY
      },
      body: JSON.stringify(record)
    });
  } catch (e) {
    console.warn("JSONBin save failed", e);
  }
}

// ---------- Auto offers ----------
function maybeGenerateOffer() {
  if (!userProfile || userProfile.role !== "seller") return;
  if (!buyerProfiles || buyerProfiles.length === 0) return;

  const lastTs = parseInt(localStorage.getItem(LAST_OFFER_KEY) || "0", 10);
  const now = Date.now();
  const thirtyMin = 30 * 60 * 1000;
  if (now - lastTs < thirtyMin) return;

  const bot = buyerProfiles[Math.floor(Math.random() * buyerProfiles.length)];
  if (!userProfile.offers) userProfile.offers = [];
  userProfile.offers.unshift({
    id: "off_" + Date.now(),
    buyerId: bot.id,
    buyerName: bot.name,
    buyerPhoto: bot.photo || "",
    message: bot.message || "Interested in your profile. Let's talk.",
    read: false,
    createdAt: now
  });
  localStorage.setItem(LAST_OFFER_KEY, String(now));
  saveUser();
  updateProfileUI();
}

// ---------- UI handlers ----------
function openProfileOrRegister() {
  if (userProfile && userProfile.role === "seller") {
    openOffers();
  } else {
    showModal("roleModal");
  }
}

function openOffers() {
  if (!userProfile) return;
  const list = $("offersList");
  const offers = userProfile.offers || [];
  if (offers.length === 0) {
    list.innerHTML = `<div class="empty-state">No offers yet.<br>Check back later.</div>`;
  } else {
    list.innerHTML = offers.map((o, idx) => {
      const avatar = o.buyerPhoto
        ? `<img src="${o.buyerPhoto}" alt="">`
        : "Photo";
      return `
        <div class="offer-item">
          <div class="offer-header">
            <div class="offer-avatar">${avatar}</div>
            <div class="offer-name">${escapeHtml(o.buyerName)}</div>
          </div>
          <div class="offer-msg">${escapeHtml(o.message)}</div>
          <button class="btn btn-primary" style="margin-top:0;padding:10px;" data-offer-idx="${idx}">Make offer</button>
        </div>
      `;
    }).join("");
    list.querySelectorAll("[data-offer-idx]").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.getAttribute("data-offer-idx"), 10);
        handleMakeOffer(offers[idx]);
      });
    });
  }
  // Mark all as read
  if (userProfile.offers) {
    userProfile.offers.forEach(o => o.read = true);
    saveUser();
    updateProfileUI();
  }
  showModal("offersModal");
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function handleMakeOffer(offer) {
  if (!userProfile.wallet || !userProfile.wallet.address) {
    pendingDealBuyer = offer;
    alert("To proceed, connect your crypto wallet.");
    hideModal("offersModal");
    showModal("walletModal");
    return;
  }
  processDeal(offer);
}

async function processDeal(offer) {
  showLoading(true);
  const text = `🔔 <b>Deal request</b>\nSeller: ${userProfile.name}\nBuyer bot: ${offer.buyerName}\nWallet: ${userProfile.wallet.network} / ${userProfile.wallet.address}`;
  await notifyAdmin(text);
  showLoading(false);
  alert("Offer sent successfully! Admin has been notified.");
  pendingDealBuyer = null;
}

// Registration flow
function startSellerReg() {
  hideModal("roleModal");
  showModal("regModal");
}

function continueToPhotos() {
  const name = $("regName").value.trim();
  const age = parseInt($("regAge").value, 10);
  const country = $("regCountry").value.trim();
  const height = $("regHeight").value.trim();
  const weight = $("regWeight").value.trim();
  const bust = $("regBust").value.trim();
  const params = $("regParams").value.trim();

  if (!name || name.length < 2) { alert("Please enter your name"); return; }
  if (!age || age < 18) { alert("Age must be 18+"); return; }

  userProfile = {
    id: "u_" + Date.now(),
    role: "seller",
    name, age, country, height, weight, bust, params,
    photos: [],
    wallet: null,
    offers: [],
    createdAt: Date.now()
  };

  selectedPhotos = [null, null, null];
  photoFiles = [];
  renderPhotoSlots();
  hideModal("regModal");
  showModal("photoModal");
}

function renderPhotoSlots() {
  const slots = $("photoSlots").querySelectorAll(".photo-slot");
  slots.forEach((slot, i) => {
    if (selectedPhotos[i]) {
      slot.innerHTML = `<img src="${selectedPhotos[i]}" alt="">`;
    } else {
      slot.innerHTML = `<span class="placeholder">Photo ${i + 1}</span>`;
    }
  });
  const count = selectedPhotos.filter(Boolean).length;
  $("btnConfirmPhotos").disabled = count < 3;
}

function handlePhotoSelect(e) {
  const files = Array.from(e.target.files || []);
  if (files.length === 0) return;
  const readers = files.slice(0, 3).map(file => {
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(file);
    });
  });
  Promise.all(readers).then(results => {
    results.forEach((data, i) => {
      if (i < 3) selectedPhotos[i] = data;
    });
    renderPhotoSlots();
  });
  e.target.value = "";
}

async function confirmPhotos() {
  const count = selectedPhotos.filter(Boolean).length;
  if (count < 3) {
    alert("Please select at least 3 photos");
    return;
  }
  userProfile.photos = selectedPhotos.filter(Boolean);
  saveUser();
  hideModal("photoModal");
  updateProfileUI();

  const text = `🆕 <b>New seller registered</b>\nName: ${userProfile.name}\nAge: ${userProfile.age}\nCountry: ${userProfile.country || "-"}`;
  notifyAdmin(text);

  // Optional: push to JSONBin
  try {
    const remote = await fetchJsonBin();
    if (remote) {
      if (!remote.profiles) remote.profiles = [];
      remote.profiles.push({
        id: userProfile.id,
        name: userProfile.name,
        age: userProfile.age,
        country: userProfile.country,
        height: userProfile.height,
        weight: userProfile.weight,
        bust: userProfile.bust,
        params: userProfile.params,
        photos: userProfile.photos,
        wallet: null,
        offers: [],
        role: "seller",
        lastOfferAt: 0
      });
      await saveJsonBin(remote);
    }
  } catch (e) {}
}

// Wallet
function openWalletForBuyer() {
  hideModal("roleModal");
  showModal("walletModal");
}

async function approveWallet() {
  const network = $("walletNetwork").value;
  const address = $("walletAddress").value.trim();
  if (!address || address.length < 10) {
    alert("Please enter a valid wallet address");
    return;
  }
  showLoading(true);
  await new Promise(r => setTimeout(r, 1000)); // simulate approve

  if (!userProfile) {
    userProfile = {
      id: "buyer_" + Date.now(),
      role: "buyer",
      name: "Buyer",
      wallet: { network, address },
      createdAt: Date.now()
    };
  } else {
    userProfile.wallet = { network, address };
  }
  saveUser();
  showLoading(false);
  hideModal("walletModal");

  const text = `💼 <b>Wallet connected</b>\nRole: ${userProfile.role}\nName: ${userProfile.name || "-"}\nNetwork: \( {network}\nAddress: <code> \){address}</code>`;
  await notifyAdmin(text);

  alert("Wallet connected successfully!");

  if (pendingDealBuyer && userProfile.role === "seller") {
    processDeal(pendingDealBuyer);
  }
  updateProfileUI();
}

// ---------- Bootstrap ----------
function bindEvents() {
  $("profileCircle").addEventListener("click", openProfileOrRegister);

  document.querySelectorAll("[data-close]").forEach(btn => {
    btn.addEventListener("click", () => hideModal(btn.getAttribute("data-close")));
  });

  $("btnSeller").addEventListener("click", startSellerReg);
  $("btnBuyer").addEventListener("click", openWalletForBuyer);
  $("regContinue").addEventListener("click", continueToPhotos);
  $("btnSelectPhotos").addEventListener("click", () => $("photoInput").click());
  $("photoInput").addEventListener("change", handlePhotoSelect);
  $("btnConfirmPhotos").addEventListener("click", confirmPhotos);
  $("btnApprove").addEventListener("click", approveWallet);

  // Close modals on overlay click
  ["roleModal","regModal","photoModal","offersModal","walletModal"].forEach(id => {
    $(id).addEventListener("click", e => {
      if (e.target === $(id)) hideModal(id);
    });
  });
}

async function afterRender() {
  // Non-blocking JSONBin load
  const data = await fetchJsonBin();
  if (data) {
    if (Array.isArray(data.buyerProfiles)) {
      buyerProfiles = data.buyerProfiles;
    }
    // If remote has our profile (matched by local id), merge offers/wallet
    if (userProfile && Array.isArray(data.profiles)) {
      const remote = data.profiles.find(p => p.id === userProfile.id);
      if (remote) {
        if (remote.offers) userProfile.offers = remote.offers;
        if (remote.wallet) userProfile.wallet = remote.wallet;
        saveUser();
        updateProfileUI();
      }
    }
  }
  // Default demo buyer bots if none loaded
  if (buyerProfiles.length === 0) {
    buyerProfiles = [
      { id: "b1", name: "Alex M.", photo: "", message: "Hi, I like your profile. Are you available for a private deal?" },
      { id: "b2", name: "James K.", photo: "", message: "Looking for exclusive content. Ready to pay in USDT." },
      { id: "b3", name: "Michael R.", photo: "", message: "Interested. Let's discuss terms privately." },
      { id: "b4", name: "David L.", photo: "", message: "Your parameters look great. Want to make an offer." },
      { id: "b5", name: "Chris P.", photo: "", message: "Available now? High budget, serious inquiry." }
    ];
  }

  maybeGenerateOffer();
}

// Synchronous first paint
(function init() {
  initTelegram();
  buildTicker();
  buildSellersGrid();
  loadUser();
  updateProfileUI();
  bindEvents();
  // Async after UI is visible
  setTimeout(afterRender, 50);
})();
</script>
